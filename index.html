<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>合成蓝色大肥鱼</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; overflow:hidden;
    background: radial-gradient(circle at 50% 0%, #1b4b63, #06161f 70%);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color: transparent;
  }
  body { display:flex; align-items:center; justify-content:center; }
  canvas {
    display:block; border-radius:18px;
    box-shadow: 0 24px 70px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.06);
    touch-action: none;
    cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
<script>
(function () {
'use strict';

const { Engine, World, Bodies, Body, Composite, Events } = Matter;

const W = 400;
const H = 700;
const DROP_Y = 56;
const DANGER_Y = 132;

/* ============================================================
   AI 图标配置（从弱到强，共 9 级）
   注意：这里的路径假设你的图片叫 icon.png，如果叫别的，请修改。
   如果格式是 svg 或 jpg，请把 .png 改掉。
   ============================================================ */
const AI_DATA = [
  { name: '豆包',      icon: './doubao/icon.png',   r: 16,  color: '#06B6D4' }, // 0 最小
  { name: 'Kimi',     icon: './kimi/icon.png',     r: 21,  color: '#EC4899' }, // 1
  { name: 'GLM',      icon: './glm/icon.png',      r: 27,  color: '#3B82F6' }, // 2
  { name: '通义千问',  icon: './qwen/icon.png',     r: 34,  color: '#7C3AED' }, // 3
  { name: 'Grok',     icon: './grok/icon.png',     r: 43,  color: '#1E293B' }, // 4
  { name: 'Gemini',   icon: './gemini/icon.png',   r: 54,  color: '#4285F4' }, // 5
  { name: 'Claude',   icon: './claude/icon.png',   r: 68,  color: '#D97706' }, // 6
  { name: 'GPT',      icon: './gpt/icon.png',      r: 85,  color: '#10A37F' }, // 7
  { name: 'DeepSeek', icon: './deepseek/icon.png', r: 110, color: '#4D6BFE' }, // 8 最大
];

const SIZE_SCALE = 1.15; // 1.0 = 原始大小，1.15 = 放大 15%

const MAX_LEVEL = AI_DATA.length - 1; // 8
// 合成出第 i 级得 SCORES[i] 分
const SCORES = [0, 1, 3, 6, 10, 18, 30, 50, 80];

/* ============================================================
   图片预加载
   ============================================================ */
const images = {};
let loadedCount = 0;
const totalImages = AI_DATA.length;

function preloadImages(callback) {
  AI_DATA.forEach((item, i) => {
    const img = new Image();
    // 本地图片不要加 crossOrigin，否则会加载失败
    // img.crossOrigin = 'anonymous';
    img.onload = () => {
      images[i] = img;
      loadedCount++;
      if (loadedCount === totalImages) callback();
    };
    img.onerror = () => {
      console.warn('图标加载失败:', item.name, '请检查路径:', item.icon);
      loadedCount++;
      if (loadedCount === totalImages) callback();
    };
    img.src = item.icon;
  });
}

/* ============================================================
   合成音效
   ============================================================ */
const mergeSound = new Audio('./sounds/merge.mp3');
mergeSound.volume = 0.55;
mergeSound.load();

/* ============================================================
   画布与自适应
   ============================================================ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const maxW = Math.min(window.innerWidth - 16, 440);
  const maxH = window.innerHeight - 16;
  const scale = Math.min(maxW / W, maxH / H);
  const cssW = Math.round(W * scale);
  const cssH = Math.round(H * scale);

  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);

  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

/* ============================================================
   物理世界
   ============================================================ */
const engine = Engine.create({ gravity: { x: 0, y: 1.15 } });
const world = engine.world;

const wallOpts = { isStatic: true, friction: 0.45, restitution: 0.05, label: 'wall' };

function addWalls() {
  const T = 120;
  World.add(world, [
    Bodies.rectangle(-T / 2, H / 2, T, H * 3, wallOpts),
    Bodies.rectangle(W + T / 2, H / 2, T, H * 3, wallOpts),
    Bodies.rectangle(W / 2, H + T / 2, W + T * 2, T, wallOpts),
  ]);
}

/* ============================================================
   游戏状态
   ============================================================ */
let state = 'playing';
let score = 0;
let best = Number(localStorage.getItem('bigai_best') || 0);
let currentLevel = 0;
let nextLevel = 0;
let aimX = W / 2;
let canDrop = true;
let overTimer = 0;
let overAt = 0;
let pointerActive = false;

const mergeQueue = [];
const effects = [];

const bubbles = Array.from({ length: 20 }, () => ({
  x: Math.random() * W,
  y: Math.random() * H,
  r: 2 + Math.random() * 6,
  v: 0.15 + Math.random() * 0.45,
  a: 0.08 + Math.random() * 0.18,
}));

/* ============================================================
   工具
   ============================================================ */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

function randomLevel() {
  const r = Math.random();
  if (r < 0.40) return 0; // 豆包
  if (r < 0.70) return 1; // Kimi
  if (r < 0.88) return 2; // GLM
  if (r < 0.96) return 3; // 通义千问
  return 4;               // Grok
}

function createOrb(x, y, level) {
  const spec = AI_DATA[level];
  const body = Bodies.circle(x, y, spec.r * SIZE_SCALE, {
    label: 'orb',
    restitution: 0.12,
    friction: 0.28,
    frictionStatic: 0.6,
    frictionAir: 0.004,
    density: 0.001,
    slop: 0.02,
  });
  body.level = level;
  body.merged = false;
  body.spawnTime = performance.now();
  return body;
}

/* ============================================================
   合成
   ============================================================ */
Events.on(engine, 'collisionStart', (evt) => {
  for (const pair of evt.pairs) {
    const a = pair.bodyA, b = pair.bodyB;
    if (a.label !== 'orb' || b.label !== 'orb') continue;
    if (a.level !== b.level) continue;
    if (a.level >= MAX_LEVEL) continue;
    if (a.merged || b.merged) continue;

    a.merged = true;
    b.merged = true;
    mergeQueue.push([a, b]);
  }
});

function processMerges() {
  while (mergeQueue.length) {
    const [a, b] = mergeQueue.shift();
    if (!a.parent || !b.parent) continue;

    const level = a.level;
    const nx = (a.position.x + b.position.x) / 2;
    const ny = (a.position.y + b.position.y) / 2;

    World.remove(world, a);
    World.remove(world, b);

    const nf = createOrb(nx, ny, level + 1);
    Body.setVelocity(nf, { x: (Math.random() - 0.5) * 1.5, y: -1.2 });
    World.add(world, nf);

    const gain = SCORES[level + 1];
    score += gain;
    if (score > best) {
      best = score;
      localStorage.setItem('bigai_best', String(best));
    }

    // 播放合成音效（用克隆体，避免快速连续合成时互相打断）
    playMergeSound(level);

    const spec = AI_DATA[level + 1];
    effects.push({ type: 'ring', x: nx, y: ny, r: spec.r * 0.9, color: spec.color, t: 0, life: 380 });
    effects.push({ type: 'text', x: nx, y: ny - spec.r, text: '+' + gain, t: 0, life: 650 });
  }
}

// 播放音效（每次克隆一份，允许同时播放多个）
function playMergeSound(level) {
  try {
    const s = mergeSound.cloneNode();
    // 等级越高，音调略高一点，合成高级鱼时有"进阶感"
    s.playbackRate = 1 + level * 0.06;
    s.volume = Math.min(0.7, 0.45 + level * 0.03);
    const p = s.play();
    if (p && p.catch) p.catch(() => {}); // 忽略浏览器拦截的报错
  } catch (e) {}
}

/* ============================================================
   掉落
   ============================================================ */
function drop() {
  if (state !== 'playing' || !canDrop) return;

  const spec = AI_DATA[currentLevel];
  const x = clamp(aimX, spec.r * SIZE_SCALE + 3, W - spec.r * SIZE_SCALE - 3);

  const orb = createOrb(x, DROP_Y, currentLevel);
  Body.setVelocity(orb, { x: 0, y: 3 });
  Body.setAngularVelocity(orb, (Math.random() - 0.5) * 0.05);
  World.add(world, orb);

  currentLevel = nextLevel;
  nextLevel = randomLevel();

  canDrop = false;
  setTimeout(() => { canDrop = true; }, 320);
}

/* ============================================================
   结束判定
   ============================================================ */
function checkGameOver(dt) {
  const now = performance.now();
  let danger = false;

  for (const b of Composite.allBodies(world)) {
    if (b.label !== 'orb') continue;
    if (now - b.spawnTime < 1200) continue;
    if (b.speed > 1.2) continue;
    if (b.position.y - AI_DATA[b.level].r * SIZE_SCALE < DANGER_Y) { danger = true; break; }
  }

  if (danger) {
    overTimer += dt;
    if (overTimer > 1100) gameOver();
  } else {
    overTimer = Math.max(0, overTimer - dt * 2.5);
  }
}

function gameOver() {
  if (state === 'over') return;
  state = 'over';
  overAt = performance.now();
  if (score > best) {
    best = score;
    localStorage.setItem('bigai_best', String(best));
  }
}

/* ============================================================
   重开
   ============================================================ */
function restart() {
  World.clear(world, false);
  Engine.clear(engine);
  addWalls();

  score = 0;
  state = 'playing';
  canDrop = true;
  overTimer = 0;
  pointerActive = false;
  aimX = W / 2;
  mergeQueue.length = 0;
  effects.length = 0;

  currentLevel = randomLevel();
  nextLevel = randomLevel();
}

/* ============================================================
   输入
   ============================================================ */
function updateAim(e) {
  const rect = canvas.getBoundingClientRect();
  const x = ((e.clientX - rect.left) / rect.width) * W;
  aimX = clamp(x, 0, W);
}

let audioUnlocked = false;
function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  const s = mergeSound.cloneNode();
  s.volume = 0;
  const p = s.play();
  if (p && p.then) {
    p.then(() => { s.pause(); s.currentTime = 0; }).catch(() => {});
  }
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  unlockAudio();
  if (state === 'over') {
    if (performance.now() - overAt > 700) restart();
    return;
  }
  pointerActive = true;
  updateAim(e);
  canvas.setPointerCapture?.(e.pointerId);
});

canvas.addEventListener('pointermove', (e) => {
  if (state === 'over') return;
  if (e.pointerType === 'mouse' || pointerActive) {
    e.preventDefault();
    updateAim(e);
  }
}, { passive: false });

function endPointer(e) {
  if (state !== 'playing') { pointerActive = false; return; }
  if (!pointerActive) return;
  pointerActive = false;
  if (e.cancelable) e.preventDefault();
  drop();
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', () => { pointerActive = false; });

/* ============================================================
   绘制单个图标
   ============================================================ */
/* ============================================================
   绘制单个图标（圆形裁剪版）
   ============================================================ */
function drawOrb(x, y, r, level, alpha) {
  if (alpha === undefined) alpha = 1;
  const spec = AI_DATA[level];
  const img = images[level];

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);

  // —— 1. 圆形底光 ——
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  const grad = ctx.createRadialGradient(0, 0, r * 0.3, 0, 0, r);
  grad.addColorStop(0, spec.color + '33');
  grad.addColorStop(1, spec.color + '11');
  ctx.fillStyle = grad;
  ctx.fill();

  // —— 2. 圆形裁剪 + cover 缩放，让图片填满圆 ——
  const innerR = r * 0.94; // 留一点点边给边框

  if (img && img.complete && img.naturalWidth > 0) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(0, 0, innerR, 0, Math.PI * 2);
    ctx.clip();

    // cover 缩放：按图片长宽比算，让短边等于圆的直径
    const iw = img.naturalWidth;
    const ih = img.naturalHeight;
    const aspect = iw / ih;
    const diameter = innerR * 2;
    let dw, dh;
    if (aspect > 1) {
      // 宽图：高度撑满，宽度按比例溢出（会被圆形裁掉）
      dh = diameter;
      dw = diameter * aspect;
    } else {
      // 高图或方图：宽度撑满，高度按比例
      dw = diameter;
      dh = diameter / aspect;
    }
    ctx.drawImage(img, -dw / 2, -dh / 2, dw, dh);

    // 如果图片有透明背景，可以在下面先垫一层白色底，让图标更清晰
    // 需要的话取消注释下面两行
    // ctx.fillStyle = '#fff';
    // ctx.fillRect(-innerR, -innerR, innerR * 2, innerR * 2);

    ctx.restore();
  } else {
    // 兜底：显示首字母
    ctx.fillStyle = spec.color;
    ctx.font = 'bold ' + (r * 0.6) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(spec.name.charAt(0), 0, 0);
  }

  // —— 3. 圆形边框（画在图片上面，保持轮廓清晰）——
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.lineWidth = Math.max(2, r * 0.06);
  ctx.strokeStyle = spec.color;
  ctx.stroke();

  ctx.restore();
}

/* ============================================================
   场景绘制
   ============================================================ */
function updateEffects(dt) {
  for (let i = effects.length - 1; i >= 0; i--) {
    const e = effects[i];
    e.t += dt;
    if (e.t >= e.life) effects.splice(i, 1);
  }
}

function render(now) {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#dff6fb');
  bg.addColorStop(0.6, '#bde8f2');
  bg.addColorStop(1, '#9bd6e6');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  for (const b of bubbles) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,' + b.a + ')';
    ctx.fill();
  }

  if (state === 'playing') {
    const flash = overTimer > 0 ? (0.35 + 0.65 * Math.abs(Math.sin(now / 130))) : 0.4;
    ctx.save();
    ctx.setLineDash([11, 9]);
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(255,82,82,' + flash.toFixed(2) + ')';
    ctx.beginPath();
    ctx.moveTo(10, DANGER_Y);
    ctx.lineTo(W - 10, DANGER_Y);
    ctx.stroke();
    ctx.restore();
  }

  for (const b of Composite.allBodies(world)) {
    if (b.label !== 'orb') continue;
    drawOrb(b.position.x, b.position.y, AI_DATA[b.level].r * SIZE_SCALE, b.level, 1);
  }

  if (state === 'playing') {
    const spec = AI_DATA[currentLevel];
    const px = clamp(aimX, spec.r * SIZE_SCALE + 3, W - spec.r * SIZE_SCALE - 3);

    ctx.save();
    ctx.setLineDash([5, 9]);
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(255,255,255,.7)';
    ctx.beginPath();
    ctx.moveTo(px, DROP_Y + spec.r + 4);
    ctx.lineTo(px, H - 14);
    ctx.stroke();
    ctx.restore();

    drawOrb(px, DROP_Y, spec.r, currentLevel, canDrop ? 1 : 0.3);

    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.font = 'bold 12px sans-serif';
    ctx.fillStyle = 'rgba(30,60,80,.65)';
    ctx.textAlign = 'left';
    ctx.fillText('下一个', 14, 22);
    ctx.restore();
    const nspec = AI_DATA[nextLevel];
    const pr = Math.min(nspec.r, 18);
    drawOrb(70, 17, pr, nextLevel, 0.9);
  }

  for (const e of effects) {
    const p = e.t / e.life;
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - p);
    if (e.type === 'ring') {
      ctx.strokeStyle = e.color;
      ctx.lineWidth = 5 * (1 - p) + 1;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r * (1 + p * 1.3), 0, Math.PI * 2);
      ctx.stroke();
    } else {
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = 'rgba(0,60,80,.55)';
      ctx.lineWidth = 3;
      ctx.font = 'bold 22px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.strokeText(e.text, e.x, e.y - p * 46);
      ctx.fillText(e.text, e.x, e.y - p * 46);
    }
    ctx.restore();
  }

  ctx.save();
  ctx.textAlign = 'right';
  ctx.font = 'bold 30px -apple-system, sans-serif';
  ctx.fillStyle = 'rgba(20,60,80,.9)';
  ctx.fillText(String(score), W - 16, 40);
  ctx.font = 'bold 12px -apple-system, sans-serif';
  ctx.fillStyle = 'rgba(20,60,80,.5)';
  ctx.fillText('最高 ' + best, W - 16, 58);
  ctx.restore();

  if (state === 'over') {
    ctx.save();
    ctx.fillStyle = 'rgba(4,26,38,.82)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 42px -apple-system, sans-serif';
    ctx.fillText('游戏结束', W / 2, H / 2 - 96);

    ctx.font = 'bold 16px -apple-system, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.fillText('本局得分', W / 2, H / 2 - 44);

    ctx.font = 'bold 62px -apple-system, sans-serif';
    ctx.fillStyle = '#FFD54F';
    ctx.fillText(String(score), W / 2, H / 2 + 22);

    ctx.font = 'bold 15px -apple-system, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.fillText('最高纪录 ' + best, W / 2, H / 2 + 58);

    const alpha = 0.45 + 0.55 * Math.abs(Math.sin(now / 420));
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#7fdcff';
    ctx.font = 'bold 18px -apple-system, sans-serif';
    ctx.fillText('点击屏幕再来一局', W / 2, H / 2 + 132);
    ctx.restore();
  }
}

/* ============================================================
   主循环
   ============================================================ */
const STEP = 1000 / 60;
let last = performance.now();
let acc = 0;

function loop(now) {
  requestAnimationFrame(loop);

  let dt = now - last;
  last = now;
  if (dt > 100) dt = 100;

  if (state === 'playing') {
    acc += dt;
    let iter = 0;
    while (acc >= STEP && iter < 5) {
      Engine.update(engine, STEP);
      acc -= STEP;
      iter++;
    }
    if (acc > STEP) acc = 0;

    processMerges();
    checkGameOver(dt);
  }

  for (const b of bubbles) {
    b.y -= b.v * (dt / 16.67);
    if (b.y < -10) {
      b.y = H + 10;
      b.x = Math.random() * W;
    }
  }

  updateEffects(dt);
  render(now);
}

/* ============================================================
   启动
   ============================================================ */
resize();

preloadImages(() => {
  addWalls();
  currentLevel = randomLevel();
  nextLevel = randomLevel();
  requestAnimationFrame(loop);
});

})();
</script>
</body>
</html>
